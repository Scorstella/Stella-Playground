</style></head><body><div class="shell"><div class="layout"><header class="masthead"><p class="mark">STELLA</p><h1>风从哪边来</h1><p class="byline">一篇互动短篇</p><svg class="landscape" viewBox="0 0 230 165" fill="none" aria-hidden="true"><path d="M0 116Q55 107 101 118T230 113M0 131Q64 122 120 134T230 128M29 147Q80 139 133 148T212 143" stroke="#a3b9ad"/><path d="M136 111l8-62h21l8 66" fill="#d9e1d8" stroke="#769284"/><path d="M140 48h29v8h-29zM145 30h19v18h-19z" fill="#e7ca8c" stroke="#7e937e"/><path d="M141 30l14-13 13 13z" fill="#385e53"/><path d="M154 31v17M142 56h27M131 114h45" stroke="#647f72"/><path d="M129 37L20 62M179 37l51-15" stroke="#b48c4d" opacity=".65"/><path d="M56 111h25l-5 5H61zM70 105v-17l9 17z" fill="#638779"/><circle cx="154" cy="39" r="3" fill="#f9e6b5"/></svg><p class="intro">三段旧事，一夜潮声。<br>你陪她走到灯亮以前。</p></header><main class="reader" id="reading" aria-labelledby="page-heading"><p class="chapter" id="chapter"></p><h2 class="heading" id="page-heading" tabindex="-1">潮水还没上来</h2><div class="prose" id="prose"></div><div class="choices" id="choices" role="group" aria-label="接下来的选择"></div><p class="endnote" id="endnote" hidden>这一夜暂时停在这里。你可以回到上一段，也可以重新走一趟。</p><nav class="navigation" aria-label="阅读导航"><button type="button" id="back" disabled>← 上一段</button><button type="button" id="home" hidden>重新开始 ↗</button></nav></main></div><footer class="footnote">虚构人物与事件 · 离线预览<br>选择只改变阅读路径，不计分。关闭页面后，本次路径不保存。</footer><p class="sr-only" id="status" role="status" aria-live="polite"></p><noscript>互动阅读需要启用 JavaScript。你也可以阅读随包附带的《完整故事.md》。</noscript></div><script>"use strict";
const story = {"entry": {"title": "潮水还没上来", "paragraphs": ["傍晚，你替镇上的木匠把一块新窗板送到灯塔。守灯人林苇接过去，指尖沾着松脂。她没有立刻装窗，只把它靠在墙边。", "海上停着一只陌生的船。隔得太远，看不清船名，只看见桅顶有一块白布，时不时被风翻起。", "“天黑以前，还有一点时间。”林苇提起马灯，“陪我走一趟？”", "你们沿着塔下的小路往回走。那条路经过的地方，她都记得。"], "choices": [{"label": "跟她下到旧码头", "target": "first"}], "chapter": "序", "ending": false}, "first": {"title": "一 · 被接住的那一夜", "paragraphs": ["旧码头只剩两根木桩。林苇用鞋尖拨开湿沙，露出一截生锈的铁环。", "她十一岁那年，父亲的小船在这里翻了。岸上的人被横浪挡住，一只外乡货船却绕过防波堤，把他们父女拉了上去。", "“船主把他儿子的干衣服给我。袖口长到膝盖。”她笑了一下，“我一直没还。”", "铁环旁边，有一条通往坡上的窄路。你问起那个晚上。"], "choices": [{"label": "问她，船上的人说了什么", "target": "first_boat"}, {"label": "问她，岸上的人做了什么", "target": "first_shore"}], "chapter": "第一段经历", "ending": false}, "first_boat": {"title": "那只搪瓷碗", "paragraphs": ["“没人先问我们是哪家的人。”林苇说。", "有个水手端来姜汤，碗沿磕掉一块。他怕她烫着，拿自己的帽子垫在碗底。船舱里晾满了衣服，海水一滴一滴落在铁盆里。", "父亲后来找过那只船，只找到一个已经停用的船名。林苇把那件大衣洗净，叠在灯塔的柜子里。", "她摸了摸铁环，起身时，把你伸来的手握得很紧。"], "choices": [{"label": "沿坡上的路走", "target": "second"}], "chapter": "第一段经历", "ending": false}, "first_shore": {"title": "岸上的绳头", "paragraphs": ["“我只记得船，父亲却总提起岸上的人。”林苇说。", "隔壁卖鱼的婶婶把自家的缆绳解下来，系在木桩上。货船正是看见绳头绑着的红围裙，才知道这里有人落水。", "那晚婶婶没了固定小船的绳，船被浪推到堤上，撞坏了。父亲替她修了整整一个冬天。", "林苇蹲下，把铁环上的渔线一圈圈解开。你替她接着那些细得扎手的线。"], "choices": [{"label": "沿坡上的路走", "target": "second"}], "chapter": "第一段经历", "ending": false}, "second": {"title": "二 · 没有灯的那一夜", "paragraphs": ["坡顶有间废油房。门口的野草长得很高，锁却是新的。林苇把马灯放在窗沿。", "她接班的第二年，也有一只陌生船在雾里求灯。她点亮了塔灯。船靠岸后，有人撬开油房，偷走了半冬的灯油。", "三天后，灯灭在涨潮前。归港的渔船撞了礁，老周的腿从此不能弯。", "她把生锈的旧锁拿给你看。锁舌上，有一道很深的钳痕。"], "choices": [{"label": "陪她去看看老周", "target": "second_zhou"}, {"label": "陪她清点剩下的油罐", "target": "second_oil"}], "chapter": "第二段经历", "ending": false}, "second_zhou": {"title": "留在门口的凳子", "paragraphs": ["老周正坐在院里补网。林苇把一包茶搁在他手边，他推过来一张矮凳。", "“又怕点错灯？”他问。林苇低头搓着茶包的纸边。", "“我那晚也看见油房开着，以为有人在搬油，没问。”老周把网眼撑给你看，“这里漏一格，鱼就都从这儿走。”", "回去时，林苇把那张矮凳搬进屋檐下，免得夜里的雨淋湿。老周没有催她答话。"], "choices": [{"label": "往东边的石阶走", "target": "third"}], "chapter": "第二段经历", "ending": false}, "second_oil": {"title": "半罐的刻度", "paragraphs": ["空油罐叠在墙角，像几只不肯出声的鼓。最里面还留着半罐，罐壁上划满浅浅的刻度。", "“那三天，我只照着账本算。”林苇用指节敲了敲罐身，“账上说够，灯就该够。”", "灯灭以后，她才发现，罐底早有一道细裂。即使没有偷油的人，那晚也未必撑得到天亮。", "她把马灯举高。你们一起看见，旧油渍沿墙缝流到了门外。"], "choices": [{"label": "往东边的石阶走", "target": "third"}], "chapter": "第二段经历", "ending": false}, "third": {"title": "三 · 风转过来的那一夜", "paragraphs": ["东边的石阶通到潮尺。林苇在第三格青苔上停住，摸出一张折软的航道图。", "去年，一位老领航员来借灯，说东槽足够深，能让运药的小船进港。那条水路，他闭着眼也走过几十回。", "林苇已经把灯朝东转了半圈。就在那时，塔外的风向旗垂下，又忽然向另一边抻直。", "她没有马上转完。你们在同一个地方停下来。"], "choices": [{"label": "看图上留下的铅笔痕", "target": "third_map"}, {"label": "听她说，领航员后来怎么办", "target": "third_pilot"}], "chapter": "第三段经历", "ending": false}, "third_map": {"title": "新画的浅滩", "paragraphs": ["图上的东槽被画了两遍。旧线笔直，新线在中间绕开一块小小的阴影。", "那晚林苇下到潮尺边，看见水退得比平常快。她让小船先停在外锚地，自己划艇去探，竹竿还没伸到底就碰到了沙。", "“一场风把沙搬过来了。图上没写。”她把铅笔递给你。", "你描了一下那块阴影。纸很薄，背面也留下一点凹痕。"], "choices": [{"label": "和她回到灯塔", "target": "question"}], "chapter": "第三段经历", "ending": false}, "third_pilot": {"title": "留给天亮的话", "paragraphs": ["“他起先很生气。”林苇说，“药耽误了，谁担得起？”", "她带回一竿湿沙，他拿在手里搓了很久，终于把缆绳重新系牢。药船等到天亮，从另一条水路进了港。", "第二天，他给林苇送来一只新罗盘。盒盖里写着：下回再拦我一次。", "她说完，把航道图折回原来的大小。折痕没有全对齐，她又展开，慢慢折了一遍。"], "choices": [{"label": "和她回到灯塔", "target": "question"}], "chapter": "第三段经历", "ending": false}, "question": {"title": "今晚要不要为陌生船只点灯？", "paragraphs": ["你们回到塔顶，海已经暗下去。那只船还在，桅顶的白布被吹成窄窄的一条。没有人能看清它在运什么。", "林苇把火柴盒放在灯座旁。{first}", "{second}", "{third}", "“你陪我走了这一趟。”她抬头看你，“今晚要不要为陌生船只点灯？”"], "choices": [{"label": "点灯，让它看见进港的方向", "target": "lit"}, {"label": "先不点灯，把船留在外海", "target": "unlit"}], "chapter": "入夜", "ending": false}, "lit": {"title": "光越过水面", "paragraphs": ["你擦亮火柴。林苇接过去，护着火苗，把它送进灯芯。", "光扫过窗框，落在远处船身上。那只船慢慢偏转船头，朝灯的方向靠近了一点。", "林苇的手仍扶着调光的铜柄。楼梯上传来急促的脚步声。"], "choices": [{"label": "听楼梯上传来的船讯", "target": "evidence_lit"}], "chapter": "入夜", "ending": false}, "unlit": {"title": "留在外面的船", "paragraphs": ["你把火柴盒推回桌里。林苇关上灯罩，隔着玻璃看海。", "那只船没有再靠近。它在外海缓缓打了个横，白布贴住桅杆，又被风揭开。", "她伸手去拿信号旗。楼梯上传来急促的脚步声。"], "choices": [{"label": "听楼梯上传来的船讯", "target": "evidence_unlit"}], "chapter": "入夜", "ending": false}, "evidence_lit": {"title": "刚到的船讯", "paragraphs": ["跑上来的是渡口的报务员。他把便携电台搁到桌上，递来一张刚抄下的船讯，纸角还沾着墨：“县里征用了那只船。船上有三个修堤工，一个伤员。绞盘坏了，外锚地抛不住锚，请求进港。”", "林苇翻过纸，背面有值班员的复核签字。船名后附着一行旧记录——正是当年偷灯油的那只船。如今掌舵的是谁，船讯里没有写。", "报务员把窗推开：“东槽下午探过，绕开沙脊的两只浮标已经挪好。西口的堤塌了，今晚只能从东边进。”", "海上的白布又闪了一下。林苇把旧航道图压到纸下，手停在铜柄旁。“把新浮标的位置报给船上。”她说。"], "choices": [{"label": "让灯继续亮着，转向东槽", "target": "lit_keep"}, {"label": "熄掉塔灯，改从岸上接应", "target": "lit_change"}], "chapter": "新证据", "ending": false}, "evidence_unlit": {"title": "刚到的船讯", "paragraphs": ["跑上来的是渡口的报务员。他把便携电台搁到桌上，递来一张刚抄下的船讯，纸角还沾着墨：“县里征用了那只船。船上有三个修堤工，一个伤员。绞盘坏了，外锚地抛不住锚，请求进港。”", "林苇翻过纸，背面有值班员的复核签字。船名后附着一行旧记录——正是当年偷灯油的那只船。如今掌舵的是谁，船讯里没有写。", "报务员把窗推开：“东槽下午探过，绕开沙脊的两只浮标已经挪好。西口的堤塌了，今晚只能从东边进。”", "海上的白布又闪了一下。林苇把旧航道图压到纸下，手停在铜柄旁。“把新浮标的位置报给船上。”她说。"], "choices": [{"label": "仍不点塔灯，改从岸上接应", "target": "unlit_keep"}, {"label": "现在点灯，照向东槽", "target": "unlit_change"}], "chapter": "新证据", "ending": false}, "lit_keep": {"title": "灯朝东边", "paragraphs": ["林苇没有熄灯。她转动铜柄，把光从坍塌的西堤移开，稳稳落在东槽的浮标上。", "“{light_reason}，”她说，“再问问他们的吃水，岸边也备一只艇。”", "你把新窗板抵在漏风的窗缝上。报务员凑近电台，把新浮标的位置又念了一遍；林苇扶着铜柄，等船头转过来。", "那只船偏向东边。它的影子太低，你们看不清船底离沙脊还有多远。电台里传来一声含混的回答，报务员请对方再说一次。", "林苇把油位记在新纸上，旁边空着一行，留给下一次回讯。天还没有亮。"], "choices": [], "chapter": "尾声 · 坚持点灯", "ending": true}, "lit_change": {"title": "光落回岸上", "paragraphs": ["林苇没有立刻动灯芯。她让报务员报出西口的险情，请船先减速，等东岸的小艇领路。回讯只说听见了，没有答应能等多久。", "“刚才是我把它引近的。”她看着来船，“灯朝东转，它也未必认得那两只新浮标。我想让领航的人到船上去。”", "她旋低灯芯。光从船身退去时，你仍能看见它在向岸边漂。她把船讯折进口袋，催报务员呼叫摆渡人，自己从柜里提起两盏马灯。", "你抱着新窗板跟在后面，把它铺过石阶上缺掉的一格。到水边，你举高一盏灯，她把另一盏搁在脚边，腾出双手解缆绳。", "摆渡人的门刚开。一阵风压低了火苗，外海那块白布比刚才更近。绳结浸得发硬，林苇扯了两下，还没有解开。"], "choices": [], "chapter": "尾声 · 改变点灯的决定", "ending": true}, "unlit_keep": {"title": "两盏低处的灯", "paragraphs": ["林苇仍没有点塔灯。她在船讯边上写下东岸摆渡人的名字，把纸交还给报务员。", "“{dark_reason}，”她说，“先请岸边备艇，带一个认得新航道的人过去。”", "电台里只有断续的杂音。锚抛不住，那只船也没停住，正一点点横过水面。林苇从柜子里取出两盏马灯，与你一起下楼。", "你们把灯举到岸边，一盏向海，一盏照着下水的石阶。摆渡人披着外衣赶来，说要先把小艇里的积水舀掉。", "塔顶的窗仍是黑的。林苇站在最下面一级，海水湿了鞋尖；她往外海看了一眼，催你把舀水的桶递下去。"], "choices": [], "chapter": "尾声 · 坚持暂不点灯", "ending": true}, "unlit_change": {"title": "迟一些的亮光", "paragraphs": ["林苇把火柴盒重新拉到面前。她划掉值夜簿上“暂不点灯”四个字，旁边写：伤员，失锚，新浮标。", "“我怕来的还是那年的人。”她看着船讯，“可在船上等的，也可能是别的人。”", "火柴第一次没有点着。你替她挡住窗缝的风，第二次，火苗站住了。", "她把灯转向东槽，让报务员通知岸边备艇，再确认船上收到了新浮标的位置。海上有一小点光回应，近得不像那只大船，也许是摆渡人先出了门。大船还没有转过来。", "林苇把旧记录夹回簿中，没有撕掉。新船讯放在上面，纸角仍向外卷着。电台里的声音又断了，她守在灯旁等下一句。"], "choices": [], "chapter": "尾声 · 改变暂不点灯的决定", "ending": true}};
const memories = {"first_boat": {"first": "她说，她忽然想起那只缺口的碗。姜汤端来时，没人先问她的名字。"}, "first_shore": {"first": "她看向旧码头。那晚，岸上的红围裙也曾是一盏灯。"}, "second_zhou": {"second": "老周的矮凳已经收进屋檐下。她想起他那条不能弯的腿，手指从火柴盒上移开了一点。"}, "second_oil": {"second": "她先俯身查了油位，又用布擦过罐底。那条细裂，曾经躲在一本数目齐全的账里。"}, "third_map": {"third": "航道图摊在桌上。她用手压住新添的浅滩，不让窗缝里的风把它掀回旧的一页。"}, "third_pilot": {"third": "罗盘盒留在窗边。她翻开盖，看了一眼那句“下回再拦我一次”，又轻轻合上。"}};
const reasons = {"light_reason": {"first_boat": "那碗姜汤，我还记得。伤员也不能只靠一块白布等着", "first_shore": "以前是岸上的人先递绳头。这一回，我们也得有人接着"}, "dark_reason": {"third_map": "东槽今天测过，浮标也挪好了。可掌舵的人有没有看懂那两只标，我们还没听见回话", "third_pilot": "那位老领航员也认得旧水路。今天这位呢？再问一句，他准备从哪边绕"}};
const path = ['entry'];
const heading=document.getElementById('page-heading'), prose=document.getElementById('prose'), choices=document.getElementById('choices'), back=document.getElementById('back'), home=document.getElementById('home');
let lockedUntil=0;
function values(){const v={};for(const id of path)Object.assign(v,memories[id]||{});for(const [key,variants]of Object.entries(reasons)){for(const [id,line]of Object.entries(variants))if(path.includes(id))v[key]=line;}return v;}
function render(moveFocus=true){
 const id=path[path.length-1],node=story[id],v=values();
 heading.textContent=node.title;
 document.title=node.title+' · 风从哪边来 · Stella';
 document.getElementById('chapter').textContent=node.chapter;
 prose.replaceChildren(...node.paragraphs.map(text=>{const p=document.createElement('p');p.textContent=text.replace(/\{(\w+)\}/g,(_,key)=>v[key]||'');return p;}));
 choices.replaceChildren(...node.choices.map(choice=>{const button=document.createElement('button');button.type='button';button.className='choice';button.dataset.target=choice.target;const label=document.createElement('span');label.textContent=choice.label;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';arrow.setAttribute('aria-hidden','true');button.append(label,arrow);return button;}));
 choices.hidden=!node.choices.length;back.disabled=path.length===1;home.hidden=id==='entry';
 document.getElementById('endnote').hidden=!node.ending;
 document.getElementById('reading').dataset.scene=id;
 document.getElementById('status').textContent=moveFocus?'已到达：'+node.title:'';
 if(moveFocus){heading.focus({preventScroll:true});heading.scrollIntoView({block:'start',behavior:'auto'});}
}
function accept(event){if(event.detail>1||performance.now()<lockedUntil)return false;lockedUntil=performance.now()+320;return true;}
choices.addEventListener('click',event=>{const button=event.target.closest('button[data-target]');if(!button||!choices.contains(button)||!accept(event))return;const target=button.dataset.target,current=story[path[path.length-1]];if(!current.choices.some(c=>c.target===target))return;path.push(target);render();});
back.addEventListener('click',event=>{if(!accept(event))return;if(path.length>1){path.pop();render();}});
home.addEventListener('click',event=>{if(!accept(event))return;path.splice(0,path.length,'entry');render();});
render(false);
</script></body></html>
